name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'  # ทุก 3 วัน เวลา 08:00 UTC (Supabase ฟรี pause ถ้าไม่มีการใช้งาน 7 วัน)
  workflow_dispatch:        # กด manual ได้จาก GitHub Actions tab

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database and storage
        run: |
          REST=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          STORAGE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/authenticated/rxmuk/meta.json")
          echo "REST status: $REST, storage status: $STORAGE"
          if [ "$REST" -ge 500 ] || [ "$REST" -eq 000 ]; then
            echo "⚠️ Supabase not responding (may be paused) - resume it at supabase.com/dashboard"
            exit 1
          fi
          echo "✅ Supabase is alive"

      # GitHub disables scheduled workflows after 60 days without repo activity; re-enabling resets that timer
      - name: Keep this schedule from being auto-disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-supabase-alive.yml/enable"
