name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Prevent multiple simultaneous deployments
concurrency:
  group: pages
  cancel-in-progress: true

# Minimal permissions - using OIDC token (most token-efficient)
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # Checkout code with minimal depth
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1  # Optimize: minimal fetch for deploy

      # Configure Pages with caching
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Publish only the files the static site loads; PHP sources, SQL dumps and
      # configs in this repo were being served publicly when the whole repo was uploaded
      - name: Assemble site
        run: |
          mkdir -p _site/public
          cp index.html _site/
          cp public/hospitals_db.js public/rxmuk-config.json public/advanced-dashboard.html _site/public/

      - name: Upload deployment artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Deploy with OIDC (no token exchange needed)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
